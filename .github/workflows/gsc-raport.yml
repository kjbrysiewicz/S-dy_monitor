# Umieść w repo jako: .github/workflows/gsc-raport.yml
name: Raport GSC

on:
  schedule:
    - cron: "0 5 * * 1-5"   # 05:00 UTC = 07:00 czasu PL (lato), dni robocze
  workflow_dispatch:          # ręczne uruchomienie do testów

permissions:
  contents: read

jobs:
  raport:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Zależności
        run: pip install -r requirements.txt

      - name: Raport GSC -> Google Sheet
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_ID: ${{ secrets.GSC_SHEET_ID }}
          GSC_SITE_URL: "sc-domain:kbrysiewicz.pl"
          GSC_LAG_DAYS: "3"
        run: python gsc_raport.py
