name: Monitor orzeczeń — środki unijne

on:
  schedule:
    # 05:30 UTC = 07:30 czasu warszawskiego (lato) / 06:30 (zima), pn–pt
    - cron: "30 5 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "Tryb uruchomienia"
        type: choice
        default: standard
        options: [standard, backfill]
      agent_max:
        description: "Limit ocen agenta AI (puste = wg config.yaml)"
        required: false
        default: ""

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 120   # backfill z analizą treści może potrwać

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitor
        env:
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          GDRIVE_FILE_ID: ${{ secrets.GDRIVE_FILE_ID }}
        run: |
          if [ "${{ github.event.inputs.mode }}" = "backfill" ]; then
            python src/monitor.py --backfill
          else
            python src/monitor.py
          fi

      - name: Run content agent
        env:
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          GDRIVE_FILE_ID: ${{ secrets.GDRIVE_FILE_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.agent_max }}" ]; then
            python src/agent.py --max "${{ github.event.inputs.agent_max }}"
          else
            python src/agent.py
          fi
